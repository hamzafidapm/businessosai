services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: businessos
      POSTGRES_PASSWORD: businessos
      POSTGRES_DB: businessos
    ports:
      - "5432:5432"
    volumes:
      - businessos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U businessos"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://businessos:businessos@db:5432/businessos
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me}
      APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
volumes:
  businessos_pgdata:
